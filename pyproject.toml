[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-antipest-sim"
version = "0.1.0"
description = "Sistema de detección y clasificación de plagas voladoras basado en fusión multisensor y visión por computador. Simulación completa, sin hardware dedicado."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Manstor21", email = "manstor21@example.com"}
]
maintainers = [
    {name = "Manstor21", email = "manstor21@example.com"}
]
keywords = [
    "computer-vision",
    "yolo",
    "sensor-fusion",
    "pest-detection",
    "velutina",
    "simulation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "opencv-python>=4.9.0,<5.0.0",
    "ultralytics>=8.2.0,<9.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "torch>=2.5.0,<3.0.0",
    "torchvision>=0.20.0,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "Pillow>=10.0.0,<13.0.0",
    "requests>=2.32.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "onnx>=1.17.0,<2.0.0",
    "onnxruntime>=1.19.0,<2.0.0",
    "tqdm>=4.67.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.0",
    "pip-tools>=7.6.0",
    "bandit>=1.9.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://github.com/Manstor21/laser-antipest-sim"
Repository = "https://github.com/Manstor21/laser-antipest-sim"
Issues = "https://github.com/Manstor21/laser-antipest-sim/issues"
Documentation = "https://github.com/Manstor21/laser-antipest-sim/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.uv]
dev-dependencies = [
    "pip-audit>=2.10.0",
    "pip-tools>=7.6.0",
    "bandit>=1.9.0",
]

[tool.pip-audit]
requirement = "requirements.lock"
desc = true
fix = false
format = "columns"
skip-editable = true

[tool.setuptools.packages.find]
where = ["."]
include = ["jetson*", "sim*", "telemetry*", "app*", "firmware*"]
exclude = ["tests*", "notebooks*", "docs*", ".git*", "__pycache__*", "*.egg-info*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "ARG001", # unused argument (common in test fixtures)
    "ARG002", # unused method argument
    "T201",  # print statements (allowed in demo/cli scripts)
]
per-file-ignores = { "tests/*" = ["S101", "T201", "ARG001", "ARG002"], "sim/dataset/fetch_gbif.py" = ["S101", "T201", "B310"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true